<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro Usuario | Huerto Hogar</title>

    <link rel="stylesheet" href="header.css">
    <link rel="stylesheet" href="main.css">
</head>
<body class="registrar_usuario">

    <main>
        <section class="reserva">
            <h1>Registrar usuario</h1>

            <form>
                <!-- Nombre -->
                <label for="nombre">Nombre completo</label>
                <input 
                    type="text"
                    id="nombre"
                    name="nombre"
                    placeholder="Ingresa tu nombre"
                    required
                >

                <!-- Correo -->
                <label for="correo">Correo electrónico</label>
                <input 
                    type="email"
                    id="correo"
                    name="correo"
                    placeholder="ejemplo@correo.com"
                    required
                >

                <!-- Confirmar Correo -->
                <label for="confirmar_correo">Confirme correo electrónico</label>
                <input 
                    type="email"
                    id="confirmar_correo"
                    name="confirmar_correo"
                    placeholder="ejemplo@correo.com"
                    required
                >
                
                <!-- Contraseña -->
                <label for="contrasena">Ingrese la contraseña</label>
                <input 
                    type="password" 
                    id="contrasena" 
                    name="contrasena" 
                    placeholder="Crea una contraseña" 
                    required
                >

                <!-- Confirmar Contraseña -->
                <label for="confirmar_contrasena">Confirme la contraseña</label>
                <input 
                    type="password" 
                    id="confirmar_contrasena" 
                    name="confirmar_contrasena" 
                    placeholder="Crea una contraseña" 
                    required
                >

                <!-- Teléfono -->
                <label for="telefono">Teléfono</label>
                <input 
                    type="tel"
                    id="telefono"
                    name="telefono"
                    placeholder="+56 9 1234 5678"
                    required
                >

                <!-- Región (Corregido) -->
                <label for="region">Selecciona la región</label>
                <select id="region" name="region" required>
                    <option value="">Selecciona una región</option>
                </select>

                <!-- Comuna (Corregido) -->
                <label for="comuna">Selecciona la comuna</label>
                <select id="comuna" name="comuna" required disabled>
                    <option value="">Primero selecciona una región</option>
                </select>

                <!-- Botones: Registrar y Volver -->
                <div style="margin-top: 20px; display: flex; gap: 10px;">
                    <!-- Botón Registrar -->
                    <button type="submit">
                        Registrar
                    </button>
                    
                    <!-- Botón Volver a la página anterior -->
                    <button type="button" onclick="history.back()" style="background-color: #6c757d; color: white;">
                        Volver atrás
                    </button>
                </div>

            </form>
        </section>    
    </main>

            };

            const regionSelect = document.getElementById('region');
            const comunaSelect = document.getElementById('comuna');

            // Llenar el select de regiones al cargar la página
            for (let region in datosChile) {
                let option = document.createElement('option');
                option.value = region;
                option.textContent = region;
                regionSelect.appendChild(option);
            }

            // Evento que detecta cuando el usuario cambia la región
            regionSelect.addEventListener('change', function() {
                const regionSeleccionada = this.value;

                // Limpiar las comunas anteriores
                comunaSelect.innerHTML = '<option value="">Selecciona una comuna</option>';

                if (regionSeleccionada) {
                    // Habilitar el select de comunas
                    comunaSelect.disabled = false;

                    // Obtener las comunas de la región seleccionada
                    const comunas = datosChile[regionSeleccionada];

                    // Llenar el select de comunas
                    comunas.forEach(function(comuna) {
                        let option = document.createElement('option');
                        option.value = comuna;
                        option.textContent = comuna;
                        comunaSelect.appendChild(option);
                    });
                } else {
                    // Si vuelve a la opción por defecto, deshabilitar y reiniciar
                    comunaSelect.disabled = true;
                    comunaSelect.innerHTML = '<option value="">Primero selecciona una región</option>';
                }
            });
        });
    </script>
</body>
</html>
